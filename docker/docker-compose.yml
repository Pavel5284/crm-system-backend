services:
  postgres:
    image: postgres:18-alpine
    container_name: crm-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crmsystem
      POSTGRES_PASSWORD: crmsystem
      POSTGRES_DB: crmsystem
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmsystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: crm-system-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: